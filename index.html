<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Угадай подарок, Яра!</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#14111f;--card:#2a2440;--card2:#3b3360;--tx:#fff;--mut:#b9b2d6;--ac:#ff4d7a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fdf1f5;--card:#fff;--card2:#ffe1ea;--tx:#2a1830;--mut:#7a6485}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:18px 14px 30px}
h1{font-size:1.5rem;margin:6px 0 4px}p.s{color:var(--mut);margin:0 0 16px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;margin:0 auto}
.g{aspect-ratio:1;border:0;border-radius:16px;background:linear-gradient(145deg,var(--card2),var(--card));font-size:2.1rem;cursor:pointer;color:var(--tx);transition:transform .15s}
.g:active{transform:scale(.92)}
.g.no{opacity:.4;animation:sh .4s}
@keyframes sh{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#msg{min-height:1.6em;margin:14px 0 0;color:var(--mut)}
#ov{position:fixed;inset:0;background:rgba(10,6,20,.88);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5;padding:20px}
#ov.on{display:flex}
#box{font-size:6rem;animation:op 1.4s ease-in forwards}
@keyframes op{0%{transform:scale(.6) rotate(0)}30%{transform:scale(1.1) rotate(-12deg)}50%{transform:scale(1.1) rotate(12deg)}80%{transform:scale(1.4);opacity:1}100%{transform:scale(3);opacity:0}}
#win{display:none;flex-direction:column;align-items:center;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
#win img{width:min(82vw,420px);border-radius:22px;box-shadow:0 0 60px #ffd54f99}
#win h2{color:#fff;font-size:1.6rem;margin:18px 0 4px}
#win p{color:#d8d0f0;margin:0 0 16px}
button.r{background:var(--ac);color:#fff;border:0;border-radius:999px;padding:12px 26px;font-size:1rem}
canvas{position:fixed;inset:0;pointer-events:none;z-index:6}
</style></head><body>

var grid=document.getElementById("grid"),msg=document.getElementById("msg"),ov=document.getElementById("ov"),box=document.getElementById("box"),win=document.getElementById("win"),tries=0,busy=false;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){tries=0;busy=false;msg.textContent="";ov.classList.remove("on");win.style.display="none";box.style.display="block";box.style.animation="none";

if(++n<400)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
